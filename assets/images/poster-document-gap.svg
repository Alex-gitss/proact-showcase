<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Document Gap Checklist demo poster</title>
  <desc id="desc">A ProAct prototype poster showing document gap checklist with missing, expired, and mismatched items identified.</desc>
  <rect width="1280" height="720" fill="#151712"/>
  <rect x="44" y="42" width="1192" height="636" rx="18" fill="#20251f" stroke="#3a443a"/>
  <rect x="78" y="82" width="518" height="556" rx="14" fill="#10140f" stroke="#334033"/>
  <rect x="626" y="82" width="576" height="556" rx="14" fill="#f6f1e5"/>
  <text x="94" y="126" fill="#f1b84b" font-family="Arial, sans-serif" font-size="22" font-weight="700">USER TRIGGER</text>
  <text x="94" y="174" fill="#fdf9ee" font-family="Arial, sans-serif" font-size="34" font-weight="800">Eligibility Review</text>
  <rect x="94" y="214" width="458" height="116" rx="12" fill="#1b211b" stroke="#445044"/>
  <text x="118" y="258" fill="#fdf9ee" font-family="Arial, sans-serif" font-size="24">Check application completeness</text>
  <text x="118" y="296" fill="#c9c3b2" font-family="Arial, sans-serif" font-size="20">Income, ID, residence, employment docs</text>
  <rect x="94" y="370" width="458" height="70" rx="12" fill="#203326" stroke="#55c785"/>
  <text x="118" y="414" fill="#55c785" font-family="Arial, sans-serif" font-size="22" font-weight="700">Gap checklist prepared</text>
  <rect x="94" y="464" width="458" height="70" rx="12" fill="#242f3a" stroke="#78b7ff"/>
  <text x="118" y="508" fill="#78b7ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Priority follow-up flagged</text>
  <text x="658" y="130" fill="#5d5a50" font-family="Arial, sans-serif" font-size="18" font-weight="700">PROACT PUSH</text>
  <text x="658" y="178" fill="#211f1a" font-family="Arial, sans-serif" font-size="30" font-weight="800">Document Gap Checklist</text>
  <rect x="658" y="220" width="492" height="78" rx="12" fill="#ffffff" stroke="#d7cfbd"/>
  <text x="684" y="252" fill="#e45f72" font-family="Arial, sans-serif" font-size="17" font-weight="700">PREDICTION</text>
  <text x="684" y="281" fill="#211f1a" font-family="Arial, sans-serif" font-size="21">Next: document gap checklist with priorities</text>
  <rect x="658" y="324" width="492" height="120" rx="12" fill="#ffffff" stroke="#d7cfbd"/>
  <text x="684" y="356" fill="#e45f72" font-family="Arial, sans-serif" font-size="17" font-weight="700">EVIDENCE</text>
  <text x="684" y="386" fill="#211f1a" font-family="Arial, sans-serif" font-size="21">GAP-02 missing docs, GAP-03 expired</text>
  <text x="684" y="418" fill="#211f1a" font-family="Arial, sans-serif" font-size="21">GAP-04 name mismatch, GAP-05 deadline</text>
  <rect x="658" y="470" width="492" height="94" rx="12" fill="#203326" stroke="#55c785"/>
  <text x="684" y="506" fill="#55c785" font-family="Arial, sans-serif" font-size="17" font-weight="700">PUSH DELIVERED</text>
  <text x="684" y="538" fill="#fdf9ee" font-family="Arial, sans-serif" font-size="22">Checklist + gap/priority/deadline table</text>
</svg>
