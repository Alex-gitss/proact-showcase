  <text x="94" y="126" fill="#f1b84b" font-family="Arial, sans-serif" font-size="22" font-weight="700">USER TRIGGER</text>
  <text x="94" y="174" fill="#fdf9ee" font-family="Arial, sans-serif" font-size="34" font-weight="800">First Paycheck</text>
  <rect x="94" y="214" width="458" height="116" rx="12" fill="#1b211b" stroke="#445044"/>
  <text x="118" y="258" fill="#fdf9ee" font-family="Arial, sans-serif" font-size="24">401k or HYSA first?</text>
