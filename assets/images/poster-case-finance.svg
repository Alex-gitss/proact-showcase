  <text x="684" y="418" fill="#211f1a" font-family="Arial, sans-serif" font-size="21">$0 HYSA minimum deposit</text>
  <rect x="658" y="470" width="492" height="94" rx="12" fill="#203326" stroke="#55c785"/>
  <text x="684" y="506" fill="#55c785" font-family="Arial, sans-serif" font-size="17" font-weight="700">DELIVERY</text>
