<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Finance first paycheck demo poster</title>
  <desc id="desc">A ProAct prototype recording poster showing a finance question, prediction panel, evidence hits, and delivery decision.</desc>
  <rect width="1280" height="720" fill="#151712"/>
  <rect x="44" y="42" width="1192" height="636" rx="18" fill="#20251f" stroke="#3a443a"/>
  <rect x="78" y="82" width="518" height="556" rx="14" fill="#10140f" stroke="#334033"/>
