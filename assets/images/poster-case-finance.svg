  <text x="658" y="178" fill="#211f1a" font-family="Arial, sans-serif" font-size="30" font-weight="800">Prepared before the next ask</text>
  <rect x="658" y="220" width="492" height="78" rx="12" fill="#ffffff" stroke="#d7cfbd"/>
